shared:
  # Written once here, referenced below, so a pattern can never drift between
  # two rules that are meant to share it.
  NotSpaceportStagedBranch: &NotSpaceportStagedBranch
    not: head~=^spaceport/staged/
  RunwayBotAuthor: &RunwayBotAuthor author~=devex-runway(-dev)?\[bot\]
  RunwayDevTitle: &RunwayDevTitle title~=to (dev|apex-[a-zA-Z0-9-]+-dev-\d{2})
  # The merge queue labels whatever it is holding, so this reads as "leave this
  # pull request alone while the queue has it". It keeps the stale and close
  # rules below from closing a pull request that is simply waiting out a freeze.
  NotHeldByTheMergeQueue: &NotHeldByTheMergeQueue label!=queued

merge_queue:
  # Every batch is independent and tested against main rather than against the
  # other pull requests, which suits a repository whose changes touch unrelated
  # deploy paths.
  mode: isolated
  # Named explicitly because the stale rules below depend on it: unset it and
  # they stop being able to tell a queued pull request from an abandoned one.
  queued_label: queued
  queue_controls_comment: false

queue_rules:
  - name: default
    merge_method: squash

merge_protections_settings:
  # Replaces the two `merge` rules. A pull request matching these is queued
  # automatically, and leaves the queue again if it stops matching, so removing
  # the label or requesting changes still calls the merge off.
  auto_merge_conditions:
    - or:
        - and:
            - label=automerge
            - label!=do-not-merge
            - label!=stale
            - "#changes-requested-reviews-by=0"
            - *NotSpaceportStagedBranch
        - and:
            - *RunwayBotAuthor
            - *RunwayDevTitle

pull_request_rules:
  - name: delete head branch after merge
    conditions:
      - or:
          - merged
          - closed
      - *NotSpaceportStagedBranch
    actions:
      delete_head_branch:
        force: false

  - name: Label PR as Stale
    conditions:
      - or:
          - updated-at<6 days ago
          - and:
              - updated-at<1 days ago
              - or:
                - label=afs-deploy-bot
                - label=Runway
      - not: merged
      - not: closed
      - *NotSpaceportStagedBranch
      - *NotHeldByTheMergeQueue
      - label!=disable-stale
    actions:
      label:
        add:
          - stale

  - name: Close Stale PRs
    conditions:
      - label=stale
      - updated-at<1 days ago
      - not: merged
      - not: closed
      - *NotSpaceportStagedBranch
      - *NotHeldByTheMergeQueue
    actions:
      close:
        message: >
          This PR was closed due to a stale status.

  - name: Close Runway DEV PR's after a day
    conditions:
      - *RunwayBotAuthor
      - *RunwayDevTitle
      - updated-at<1 days ago
      - label!=disable-stale
      - not: merged
      - not: closed
      - *NotHeldByTheMergeQueue
    actions:
      close:
        message: >
          This Runway dev PR was closed after being inactive for 1 day

  - name: Post Warning Comment on Runway PR's that are inactive for a day
    conditions:
      - *RunwayBotAuthor
      - updated-at<25 hours ago
      - label!=disable-stale
      - not: merged
      - not: closed
      - *NotHeldByTheMergeQueue
    actions:
      comment:
        message: >
          This Runway PR has been inactive for more than 1 day. It will be closed in 24 hours. To stop this from happening you can add the `disable-stale` label

  - name: Close Runway non-dev PR's after two days
    conditions:
      - *RunwayBotAuthor
      - updated-at<2 days ago
      - label!=disable-stale
      - not: merged
      - not: closed
      - *NotHeldByTheMergeQueue
    actions:
      close:
        message: >
          This Runway PR was closed after being inactive for 2 days
